name: Docker Image CI

on:
  push:
    branches: [ "docker" ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/openclaw

jobs:
  # Build base sandbox image first (required by sandbox-common)
  build-sandbox:
    runs-on: ubuntu-latest
    outputs:
      sandbox-tag: ${{ steps.meta-sandbox.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata for sandbox
        id: meta-sandbox
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sandbox

      - name: Build and push sandbox
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-sandbox.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

  # Build main images in parallel (no dependencies)
  build-main:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata for main
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push main
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

  # Build sandbox-browser (depends on sandbox for base image context)
  build-sandbox-browser:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata for sandbox-browser
        id: meta-sandbox-browser
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sandbox-browser

      - name: Build and push sandbox-browser
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sandbox-browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-sandbox-browser.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

  # Build sandbox-common (depends on sandbox image)
  build-sandbox-common:
    runs-on: ubuntu-latest
    needs: [build-sandbox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull sandbox base image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sandbox || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata for sandbox-common
        id: meta-sandbox-common
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sandbox-common

      - name: Build and push sandbox-common
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sandbox-common
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-sandbox-common.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sandbox
          load: false
